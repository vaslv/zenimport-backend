[project]
name = "zenimport-backend"
version = "0.2.0"
description = "Independent bank-history synchronization backend for ZenMoney"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "fastapi==0.142.2",
    "pydantic==2.13.5",
    "uvicorn==0.54.0",
    "zenmoney-python==0.7.0",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "httpx==0.28.1"]

[project.urls]
Repository = "https://github.com/vaslv/zenimport-backend"
Issues = "https://github.com/vaslv/zenimport-backend/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
