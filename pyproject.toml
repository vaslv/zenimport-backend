[project]
name = "zenimport"
version = "0.1.0"
description = "Vietnamese bank imports and reviewed synchronization with ZenMoney"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "httpx>=0.28,<0.29",
    "simplejson>=3.19,<4",
    "zenmoney-api-client==0.6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
