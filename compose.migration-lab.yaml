# Always supply the private --env-file generated by migration_lab.py init.
# This file intentionally does not extend production compose.yaml.
name: zenimport-lab-${LAB_RUN_ID:?Run migration_lab.py init first}
x-lab: &lab
  image: zenimport-migration-lab:${LAB_RUN_ID:?}
  build:
    context: .
    target: migration-lab
  user: "${LAB_UID:?}:${LAB_GID:?}"
  read_only: true
  tmpfs:
    - /tmp
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  init: true
  restart: "no"
  stop_grace_period: 30s
  environment: &environment
    LAB_RUN_ID: ${LAB_RUN_ID:?}
    LAB_TOKEN_FILE: /run/secrets/test-token.env
    LAB_IDENTITY_FILE: /lab/identity.json
    LAB_STATE_DIR: /lab
  volumes: &volumes
    - type: bind
      source: ${LAB_TOKEN_FILE:?}
      target: /run/secrets/test-token.env
      read_only: true
    - type: bind
      source: ${LAB_STATE_DIR:?}
      target: /lab
      read_only: true
  networks: [lab]
services:
  tools:
    <<: *lab
    profiles: [tools]
    volumes:
      - type: bind
        source: ${LAB_TOKEN_FILE:?}
        target: /run/secrets/test-token.env
        read_only: true
      - type: bind
        source: ${LAB_STATE_DIR:?}
        target: /lab
    healthcheck:
      disable: true
  server-a:
    <<: *lab
    profiles: [a]
    command: [serve]
    environment:
      <<: *environment
      API_TOKEN: ${LAB_API_TOKEN_A:?}
      DATABASE_PATH: /data/zenimport.sqlite3
    volumes:
      - type: bind
        source: ${LAB_TOKEN_FILE:?}
        target: /run/secrets/test-token.env
        read_only: true
      - type: bind
        source: ${LAB_STATE_DIR:?}
        target: /lab
        read_only: true
      - type: bind
        source: ${LAB_STATE_DIR:?}/server-a
        target: /data
    ports: ["127.0.0.1:${LAB_PORT_A:?}:8000"]
  server-b:
    <<: *lab
    profiles: [b]
    command: [serve]
    environment:
      <<: *environment
      API_TOKEN: ${LAB_API_TOKEN_B:?}
      DATABASE_PATH: /data/zenimport.sqlite3
    volumes:
      - type: bind
        source: ${LAB_TOKEN_FILE:?}
        target: /run/secrets/test-token.env
        read_only: true
      - type: bind
        source: ${LAB_STATE_DIR:?}
        target: /lab
        read_only: true
      - type: bind
        source: ${LAB_STATE_DIR:?}/server-b
        target: /data
    ports: ["127.0.0.1:${LAB_PORT_B:?}:8000"]
networks:
  lab: {}
