[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "zenimport-zenmoney"
version = "0.3.0"
description = "ZenMoney diff reads and guarded category updates and transaction creation"
requires-python = ">=3.12"
dependencies = ["httpx>=0.28,<0.29"]

[tool.setuptools.packages.find]
where = ["src"]
