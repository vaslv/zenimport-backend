name: Backend container checks
on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Tests, restart, crash recovery and snapshot (fake data)
        run: ./scripts/test-docker.sh '${{ matrix.platform }}'
      - name: Image-only server deployment (no ZenMoney token)
        run: ./scripts/test-server-image.sh '${{ matrix.platform }}'
