name: Publish backend image
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ghcr-${{ github.repository }}
  cancel-in-progress: false
jobs:
  verify:
    uses: ./.github/workflows/ci.yml
  publish:
    if: github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Authenticate to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_USER" --password-stdin
      - name: Build and publish verified architectures
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ github.sha }}
          SERVER_URL: ${{ github.server_url }}
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/${REPOSITORY,,}"
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          if existing=$(docker buildx imagetools inspect "$image:$version" 2>&1); then
            echo 'This image version is already published. Do not overwrite it; prepare a new version.' >&2
            exit 1
          elif ! grep -Eiq 'not found|manifest unknown' <<< "$existing"; then
            echo 'Could not confirm that this image version is unused. Refusing to publish.' >&2
            printf '%s\n' "$existing" >&2
            exit 1
          fi
          docker buildx build --platform linux/amd64,linux/arm64 --target final \
            --build-arg "VCS_REF=$REVISION" --build-arg "SOURCE_URL=$SERVER_URL/$REPOSITORY" \
            --tag "$image:$version" --tag "$image:sha-$REVISION" \
            --metadata-file "$RUNNER_TEMP/image-metadata.json" --push .
          digest=$(python3 -c 'import json,os; print(json.load(open(os.environ["RUNNER_TEMP"]+"/image-metadata.json"))["containerimage.digest"])')
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "reference=$image@$digest" >> "$GITHUB_OUTPUT"
          echo "Published image: \`$image@$digest\`" >> "$GITHUB_STEP_SUMMARY"
          docker buildx imagetools inspect "$image@$digest" --raw > "$RUNNER_TEMP/image-manifest.json"
          python3 - <<'PY'
          import json, os
          manifest = json.load(open(os.environ['RUNNER_TEMP']+'/image-manifest.json'))
          platforms = {(x['platform']['os'], x['platform']['architecture']) for x in manifest['manifests']}
          assert {('linux', 'amd64'), ('linux', 'arm64')} <= platforms, platforms
          PY
      - name: Verify published image by digest with disposable data
        env:
          ZENIMPORT_TEST_IMAGE: ${{ steps.image.outputs.reference }}
        run: |
          ./scripts/test-server-image.sh linux/arm64
          ./scripts/test-server-image.sh linux/amd64
      - name: Remove registry session
        if: always()
        run: docker logout ghcr.io
