<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="style.css"><link rel="stylesheet" href="popup-minimal.css"><title>ZenImport</title>
<body class="popup minimal"><header><h1>ZenImport</h1><button id="settings" class="secondary" aria-label="Настройки">⚙</button></header>
<label class="toggle"><span>На странице банка</span><input id="inline-enable" type="checkbox" role="switch"><span class="track" aria-hidden="true"></span></label>
<p id="inline-status" role="status" aria-live="polite"></p>
<button id="send-new" disabled>Добавить новые операции</button>
<p id="send-status" role="status" aria-live="polite"></p>
<script type="module" src="popup-minimal.js"></script></body></html>
