<!doctype html><html lang="ru"><meta charset="utf-8"><link rel="stylesheet" href="style.css">
<title>ZenImport</title><body class="popup"><h1>ZenImport</h1><p>VietinBank: включите получение JSON, закройте это окно и выполните поиск истории в банке. Затем откройте расширение для проверки результата. Если ответ не появляется, откройте DevTools → Network и измените период поиска.</p>
<button id="capture">Получить JSON VietinBank</button><button id="clear-capture" hidden>Очистить захват</button>
<label>Или загрузить сохранённый ответ банка <input id="json-file" type="file" accept=".json,.txt,application/json,text/plain"></label>
<button id="extract">Считать текущую страницу</button><button id="collect">Собрать весь выбранный период VietinBank</button><button id="import" hidden>Отправить на сервер</button>
<button id="debug" hidden>Скачать debug JSON локально</button><button id="open">Открыть интерфейс</button>
<p id="status" role="status"></p><script type="module" src="popup.js"></script></body></html>
