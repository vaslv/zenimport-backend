services:
  backend:
    ports: !reset []
    restart: "no"
    environment:
      ZENMONEY_TOKEN: ""
      DATABASE_PATH: /data/zenimport.sqlite3
  tests:
    profiles: [test]
    build:
      context: .
      target: tests
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp
  smoke:
    profiles: [test]
    build:
      context: .
      target: tests
    environment:
      API_TOKEN: ${API_TOKEN:-}
      BASE_URL: http://backend:8000
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - data:/data
    command: ["python", "tests/container_smoke.py", "seed"]

networks:
  default:
    internal: true
